<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atlas.js</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #ddd;
            overflow: hidden;
        }

        .atlas-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            pointer-events: auto;
        }

        .atlas-zoom-button {
            width: 30px;
            height: 30px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            margin-bottom: 5px;
        }

        .atlas-zoom-button:hover {
            background-color: #f4f4f4;
        }

        .atlas-attribution {
            position: absolute;
            bottom: 0;
            right: 0;
            z-index: 3;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 2px 5px;
            font-size: 12px;
            font-family: sans-serif;
            pointer-events: auto;
        }

        .atlas-attribution a {
            color: #0078A8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="map-container"></div>
    <script>
        /**
         * Atlas.js - A lightweight, dependency-free, and self-contained JavaScript library for interactive maps.
         * It uses native Canvas for tile rendering and SVG for UI controls and markers.
         * Designed to be mobile-first and easy to understand.
         */
        class Atlas {
            /**
             * Initializes a new map instance.
             * @param {string} containerId The ID of the HTML element that will contain the map.
             * @param {object} [options={}] Configuration options for the map.
             * @param {number[]} [options.center=[0, 0]] Initial geographical center of the map [latitude, longitude].
             * @param {number} [options.zoom=1] Initial zoom level.
             * @param {number} [options.minZoom=0] Minimum allowed zoom level.
             * @param {number} [options.maxZoom=18] Maximum allowed zoom level.
             * @param {string} [options.tileUrl='...'] URL template for map tiles.
             * @param {string} [options.attribution='...'] Attribution text to display.
             */
            constructor(containerId, options = {}) {
                this._container = document.getElementById(containerId);
                if (!this._container) {
                    throw new Error(`Container element with id "${containerId}" not found.`);
                }

                // --- Setup Core Properties ---

                // Merge user options with defaults
                this._options = {
                    center: [0, 0],
                    zoom: 1,
                    minZoom: 0,
                    maxZoom: 18,
                    tileUrl: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    // UX Configuration
                    inertia: true,
                    inertiaDeceleration: 0.95,
                    doubleClickZoom: true,
                    zoomAnimationDuration: 300,
                    wheelDebounce: 40,
                    panThreshold: 5, // The minimum number of pixels a user must pan before it is considered a drag.
                    ...options
                };

                // In-memory cache for tile images to avoid re-fetching
                this._tileCache = new Map();
                this._subdomains = ['a', 'b', 'c']; // For tile providers with subdomains

                // Event handling system
                this._events = {};

                // Marker management
                this._markers = [];

                // Animation state
                this._transform = { x: 0, y: 0, scale: 1 };
                this._animationFrameId = null;

                // Tap detection state
                this._lastTapTime = 0;
                this._tapTimeout = null;
                this._wheelDebounceTimeout = null;

                // --- Initialization ---
                this._initLayout();
                this.setView(this._options.center, this._options.zoom);
            }

            /**
             * Sets up the map's DOM structure, including canvas for tiles and SVG for overlays.
             * @private
             */
            _initLayout() {
                // Ensure the container has a relative position for absolute child elements
                this._container.style.position = this._container.style.position || 'relative';
                this._container.style.cursor = 'grab';

                // Create the transform pane for panning and zooming animations
                this._transformPane = document.createElement('div');
                this._transformPane.style.position = 'absolute';
                this._transformPane.style.width = '100%';
                this._transformPane.style.height = '100%';
                this._transformPane.style.zIndex = '1';
                // Use will-change to hint to the browser about upcoming transformations
                this._transformPane.style.willChange = 'transform';
                this._container.appendChild(this._transformPane);

                // Create canvas for rendering map tiles, now inside the transform pane
                this._canvas = document.createElement('canvas');
                this._canvas.style.position = 'absolute';
                this._canvas.style.top = '0';
                this._canvas.style.left = '0';
                this._canvas.style.zIndex = '1';
                this._transformPane.appendChild(this._canvas);
                this._ctx = this._canvas.getContext('2d');

                // Create SVG layer for markers, also inside the transform pane
                this._svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                this._svg.style.position = 'absolute';
                this._svg.style.top = '0';
                this._svg.style.left = '0';
                this._svg.style.width = '100%';
                this._svg.style.height = '100%';
                this._svg.style.zIndex = '2';
                this._svg.style.pointerEvents = 'none';
                this._transformPane.appendChild(this._svg);

                // A dedicated SVG group for markers to keep them organized
                this._markerPane = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this._svg.appendChild(this._markerPane);

                // Add UI elements like zoom buttons and attribution
                this._initControls();

                // Observe container resizing to keep the map dimensions updated
                this._resizeObserver = new ResizeObserver(() => this._onResize());
                this._resizeObserver.observe(this._container);

                // Attach all necessary event listeners for interactions
                this._addEventListeners();

                // Perform initial size calculation
                this._onResize();
            }

            /**
             * Creates and adds UI controls (zoom buttons, attribution) to the map.
             * @private
             */
            _initControls() {
                const controlsContainer = document.createElement('div');
                controlsContainer.className = 'atlas-controls';
                this._container.appendChild(controlsContainer);

                // Zoom In Button
                const zoomInButton = document.createElement('div');
                zoomInButton.className = 'atlas-zoom-button';
                zoomInButton.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 3v7m-3.5-3.5h7" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>';
                zoomInButton.onclick = (e) => {
                    e.stopPropagation();
                    const centerPoint = { x: this._width / 2, y: this._height / 2 };
                    const currentZoom = this._zoom + Math.log2(this._transform.scale);
                    this._animateZoom(Math.round(currentZoom) + 1, centerPoint);
                };
                controlsContainer.appendChild(zoomInButton);

                // Zoom Out Button
                const zoomOutButton = document.createElement('div');
                zoomOutButton.className = 'atlas-zoom-button';
                zoomOutButton.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M6.5 10h7" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>';
                zoomOutButton.onclick = (e) => {
                    e.stopPropagation();
                    const centerPoint = { x: this._width / 2, y: this._height / 2 };
                    const currentZoom = this._zoom + Math.log2(this._transform.scale);
                    this._animateZoom(Math.round(currentZoom) - 1, centerPoint);
                };
                controlsContainer.appendChild(zoomOutButton);

                // Attribution Text
                if (this._options.attribution) {
                    const attributionControl = document.createElement('div');
                    attributionControl.className = 'atlas-attribution';
                    attributionControl.innerHTML = this._options.attribution;
                    this._container.appendChild(attributionControl);
                }
            }

            /**
             * Attaches all event listeners for map interactions.
             * @private
             */
            _addEventListeners() {
                // Mouse drag events
                this._container.addEventListener('mousedown', (e) => this._onDragStart(e));
                window.addEventListener('mousemove', (e) => this._onDragMove(e));
                window.addEventListener('mouseup', (e) => this._onDragEnd(e));

                // Touch drag and pinch-zoom events
                this._container.addEventListener('touchstart', (e) => this._onTouchStart(e), { passive: false });
                window.addEventListener('touchmove', (e) => this._onTouchMove(e), { passive: false });
                window.addEventListener('touchend', (e) => this._onTouchEnd(e));

                // Mouse wheel zoom
                this._container.addEventListener('wheel', (e) => this._onWheel(e));
            }

            // --- Interaction Handlers ---

            /** Handles mouse wheel zooming with smooth, cursor-centered interaction. */
            _onWheel(e) {
                e.preventDefault();
                this._commitInteraction(); // Commit any pending interactions

                const rect = this._container.getBoundingClientRect();
                const point = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                const currentZoom = this._zoom + Math.log2(this._transform.scale);
                const delta = -e.deltaY * 0.01;
                let newZoom = currentZoom + delta;
                newZoom = Math.max(this._options.minZoom, Math.min(this._options.maxZoom, newZoom));

                const newScale = Math.pow(2, newZoom - this._zoom);
                const oldScale = this._transform.scale;

                const dx = point.x * (1 - newScale / oldScale);
                const dy = point.y * (1 - newScale / oldScale);

                this._transform.x = this._transform.x * (newScale / oldScale) + dx;
                this._transform.y = this._transform.y * (newScale / oldScale) + dy;
                this._transform.scale = newScale;
                this._updateTransform();

                this._wheelDebounceTimeout = setTimeout(() => this._commitTransform(), this._options.wheelDebounce);
            }

            /** Handles the start of a touch interaction (pan or pinch). */
            _onTouchStart(e) {
                this._commitInteraction(); // Commit any pending interactions

                if (e.touches.length === 1) {
                    this._onDragStart(e);
                } else if (e.touches.length >= 2) {
                    this._isDragging = false;
                    const rect = this._container.getBoundingClientRect();
                    this._isPinching = true;
                    this._pinchStartDist = this._getPinchDist(e);
                    this._pinchStartCenter = this._getPinchCenter(e, rect);
                    this._pinchStartTransform = { ...this._transform };
                }
            }

            /** Handles touch movement for panning or pinch-zooming. */
            _onTouchMove(e) {
                if (this._isPinching && e.touches.length >= 2) {
                    e.preventDefault();
                    const rect = this._container.getBoundingClientRect();
                    const currentDist = this._getPinchDist(e);
                    const currentCenter = this._getPinchCenter(e, rect);
                    const scaleRatio = currentDist / this._pinchStartDist;
                    const panDelta = {
                        x: currentCenter.x - this._pinchStartCenter.x,
                        y: currentCenter.y - this._pinchStartCenter.y,
                    };
                    this._transform.scale = this._pinchStartTransform.scale * scaleRatio;
                    this._transform.x = this._pinchStartTransform.x + panDelta.x + (this._pinchStartCenter.x * (1 - scaleRatio));
                    this._transform.y = this._pinchStartTransform.y + panDelta.y + (this._pinchStartCenter.y * (1 - scaleRatio));
                    this._updateTransform();
                    this._fire('move');
                } else if (e.touches.length === 1 && this._isDragging) {
                    this._onDragMove(e);
                }
            }

            /** Handles the end of a touch interaction. */
            _onTouchEnd(e) {
                if (this._isPinching && e.touches.length < 2) {
                    this._isPinching = false;
                    this._commitTransform();
                }
                if (e.touches.length < 1) {
                    this._onDragEnd(e);
                }
            }

            _getPinchDist(e) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                return Math.sqrt(Math.pow(t1.clientX - t2.clientX, 2) + Math.pow(t1.clientY - t2.clientY, 2));
            }

            _getPinchCenter(e, rect) {
                const t1 = e.touches[0];
                const t2 = e.touches[1];
                return {
                    x: (t1.clientX + t2.clientX) / 2 - rect.left,
                    y: (t1.clientY + t2.clientY) / 2 - rect.top,
                };
            }

            /** Handles the start of a mouse or touch drag. */
            _onDragStart(e) {
                if (e.type === 'touchstart' && e.touches.length > 1) return;
                this._commitInteraction(); // Commit any pending interactions

                e.preventDefault();
                this._isDragging = true;
                this._dragStart = this._getEventPoint(e);
                this._container.style.cursor = 'grabbing';
                this._dragMoved = false;
                this._velocityHistory = [];
                this._lastMoveTime = performance.now();
            }

            /** Handles mouse or touch movement during a drag. */
            _onDragMove(e) {
                if (!this._isDragging) return;
                if (e.type === 'touchmove' && e.touches.length > 1) return;
                e.preventDefault();
                const currentPoint = this._getEventPoint(e);
                const dx = currentPoint.x - this._dragStart.x;
                const dy = currentPoint.y - this._dragStart.y;

                if (!this._dragMoved && Math.sqrt(dx*dx + dy*dy) < this._options.panThreshold) return;

                this._dragMoved = true;
                this._dragStart = currentPoint;
                this._transform.x += dx;
                this._transform.y += dy;
                this._updateTransform();

                const now = performance.now();
                const dt = now - this._lastMoveTime;
                if (dt > 0) {
                    this._velocityHistory.push({ x: dx / dt, y: dy / dt });
                    if (this._velocityHistory.length > 5) this._velocityHistory.shift();
                }
                this._lastMoveTime = now;
                this._fire('move');
            }

            /** Handles the end of a mouse or touch drag. */
            _onDragEnd(e) {
                if (!this._isDragging) return;
                this._isDragging = false;
                this._container.style.cursor = 'grab';

                if (this._options.inertia && this._dragMoved && this._velocityHistory.length > 0) {
                    const avgVelocity = this._velocityHistory.reduce((acc, v) => ({ x: acc.x + v.x, y: acc.y + v.y }), { x: 0, y: 0 });
                    avgVelocity.x /= this._velocityHistory.length;
                    avgVelocity.y /= this._velocityHistory.length;
                    const speed = Math.sqrt(avgVelocity.x * avgVelocity.x + avgVelocity.y * avgVelocity.y);
                    if (speed > 0.1) {
                        this._startInertiaAnimation(avgVelocity);
                        return;
                    }
                }

                if (this._dragMoved) {
                    this._commitTransform();
                } else {
                    const now = performance.now();
                    const point = this._getEventPoint(e);
                    const rect = this._container.getBoundingClientRect();
                    const containerPoint = { x: point.x - rect.left, y: point.y - rect.top };

                    if (now - this._lastTapTime < 300) {
                        clearTimeout(this._tapTimeout);
                        this._lastTapTime = 0;
                        if (this._options.doubleClickZoom) {
                            this._commitTransform({ silent: true });
                            const newZoom = this._zoom + 1;
                            this._animateZoom(newZoom, containerPoint);
                        }
                    } else {
                        this._lastTapTime = now;
                        this._tapTimeout = setTimeout(() => {
                            const latlng = this._unproject({
                                x: containerPoint.x + this._pixelOrigin.x,
                                y: containerPoint.y + this._pixelOrigin.y,
                            });
                            this._fire('click', { latlng, point: containerPoint });
                        }, 300);
                    }
                }
            }

            /** Starts the inertia animation after a drag. */
            _startInertiaAnimation(velocity) {
                this._animationFrameId = requestAnimationFrame(() => this._inertiaStep(velocity));
            }

            /** A single step in the inertia animation loop. */
            _inertiaStep(velocity) {
                // Apply deceleration
                velocity.x *= this._options.inertiaDeceleration;
                velocity.y *= this._options.inertiaDeceleration;

                // Update transform
                this._transform.x += velocity.x;
                this._transform.y += velocity.y;
                this._updateTransform();

                const speed = Math.sqrt(velocity.x * velocity.x + velocity.y * velocity.y);
                if (speed < 0.05) { // Stop when movement is negligible
                    this._animationFrameId = null;
                    this._finalizePan();
                } else {
                    this._animationFrameId = requestAnimationFrame(() => this._inertiaStep(velocity));
                }
            }

            /**
             * Commits the current transform to the map's base state (_pixelOrigin, _center, _zoom),
             * then resets the transform and re-renders the map with fresh tiles.
             * This is the single source of truth for finalizing an interaction.
             */
            _commitTransform(options = {}) {
                const finalZoom = this._zoom + Math.log2(this._transform.scale);
                // If a target zoom is provided (e.g., from an animation), use it. Otherwise, snap to the nearest integer.
                const snappedZoom = options.targetZoom !== undefined ? options.targetZoom : Math.round(finalZoom);

                // Update the pixel origin based on the final transform.
                this._pixelOrigin.x -= this._transform.x;
                this._pixelOrigin.y -= this._transform.y;

                // Calculate the new geographical center based on the final state.
                this._center = this._unproject({
                    x: this._pixelOrigin.x + this._width / 2,
                    y: this._pixelOrigin.y + this._height / 2
                }, finalZoom);

                // Reset the transform layer for the next interaction.
                this._transform = { x: 0, y: 0, scale: 1 };
                this._updateTransform();

                // Set the new base zoom and trigger a full re-render.
                this._zoom = snappedZoom;
                this._updateView();

                if (!options.silent) {
                    this._fire('moveend');
                    this._fire('zoomend', { zoom: this._zoom });
                }
            }

            /** Animates a zoom to a new level, centered on a specific point. */
            _animateZoom(targetZoom, point) {
                // Get the zoom level at the start of the animation, including any temporary transform scale.
                const startZoom = this._zoom + Math.log2(this._transform.scale);
                targetZoom = Math.max(this._options.minZoom, Math.min(this._options.maxZoom, targetZoom));

                if (Math.abs(targetZoom - startZoom) < 0.01) return;

                const startTime = performance.now();
                const duration = this._options.zoomAnimationDuration;
                const startTransform = { ...this._transform };

                const zoomStep = (timestamp) => {
                    const progress = Math.min((timestamp - startTime) / duration, 1);
                    // Use an easing function for a smooth, non-linear animation.
                    const t = 1 - Math.pow(1 - progress, 3); // Ease-out cubic

                    // Calculate the zoom and scale at the current animation frame.
                    const currentZoom = startZoom + (targetZoom - startZoom) * t;
                    const scale = Math.pow(2, currentZoom - this._zoom);

                    // Calculate the translation needed to keep the focal point stationary.
                    const dx = (point.x * (1 - scale / startTransform.scale));
                    const dy = (point.y * (1 - scale / startTransform.scale));

                    // Apply the interpolated scale and calculated translation.
                    this._transform.scale = scale;
                    this._transform.x = startTransform.x * (scale / startTransform.scale) + dx;
                    this._transform.y = startTransform.y * (scale / startTransform.scale) + dy;
                    this._updateTransform();

                    if (progress < 1) {
                        this._animationFrameId = requestAnimationFrame(zoomStep);
                    } else {
                        // When the animation completes, finalize the map's state.
                        const newCenter = this._unproject({
                            x: this._pixelOrigin.x - this._transform.x + this._width / 2,
                            y: this._pixelOrigin.y - this._transform.y + this._height / 2,
                        }, targetZoom);

                        this._transform = {x: 0, y: 0, scale: 1};
                        this._updateTransform();
                        this.setView(newCenter, targetZoom);
                        this._fire('zoomend', { zoom: this._zoom });
                    }
                };

                this._animationFrameId = requestAnimationFrame(zoomStep);
            }

            /** Gets the screen coordinates from a mouse or touch event. */
            _getEventPoint(e) {
                const point = e.touches ? e.touches[0] : e;
                return { x: point.clientX, y: point.clientY };
            }

            /** Handles map container resizing. */
            _onResize() {
                this._width = this._container.clientWidth;
                this._height = this._container.clientHeight;

                this._canvas.width = this._width;
                this._canvas.height = this._height;

                if (this._center && this._zoom !== undefined) {
                    this._updateView();
                }
            }

            // --- Coordinate and Tile Utilities ---

            /**
             * Projects geographical coordinates (lat, lng) to world pixel coordinates at a given zoom level.
             * Uses the Web Mercator projection (EPSG:3857).
             * @param {number[]} latlng - The geographical coordinates [latitude, longitude].
             * @param {number} [zoom] - The zoom level to project at. Defaults to the current map zoom.
             * @returns {{x: number, y: number}} The world pixel coordinates.
             * @private
             */
            _project(latlng, zoom) {
                const z = zoom === undefined ? this._zoom : zoom;
                const d = Math.PI / 180;
                const max = 1 - 1e-15;
                const sin = Math.max(Math.min(Math.sin(latlng[0] * d), max), -max);

                const scale = 256 * Math.pow(2, z);

                const x = scale * (latlng[1] / 360 + 0.5);
                const y = scale * (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI));

                return { x, y };
            }

            /**
             * Unprojects world pixel coordinates to geographical coordinates (lat, lng) at a given zoom level.
             * @param {{x: number, y: number}} point - The world pixel coordinates.
             * @param {number} [zoom] - The zoom level to unproject at. Defaults to the current map zoom.
             * @returns {number[]} The geographical coordinates [latitude, longitude].
             * @private
             */
            _unproject(point, zoom) {
                const z = zoom === undefined ? this._zoom : zoom;
                const d = 180 / Math.PI;
                const scale = 256 * Math.pow(2, z);

                const lng = (point.x / scale - 0.5) * 360;
                const lat = (2 * Math.atan(Math.exp((0.5 - point.y / scale) * 4 * Math.PI)) - Math.PI / 2) * d;

                return [lat, lng];
            }

            /** Recalculates the map's pixel origin and triggers a re-render. */
            _updateView() {
                const centerPx = this._project(this._center);

                // The top-left corner of the viewport in world pixel coordinates
                this._pixelOrigin = {
                    x: centerPx.x - this._width / 2,
                    y: centerPx.y - this._height / 2
                };

                this._render();
            }

            /** Applies the current transform to the transform pane. */
            _updateTransform() {
                const { x, y, scale } = this._transform;
                this._transformPane.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
            }

            /** Generates a tile URL for the given XYZ coordinates. */
            _getTileUrl(x, y, z) {
                const s = this._subdomains[(x + y) % this._subdomains.length];
                return this._options.tileUrl
                    .replace('{s}', s)
                    .replace('{z}', z)
                    .replace('{x}', x)
                    .replace('{y}', y);
            }

            // --- Rendering ---

            /** Schedules a repaint of the map. Uses requestAnimationFrame for performance. */
            _render() {
                if (this._renderId) {
                    cancelAnimationFrame(this._renderId);
                }
                this._renderId = requestAnimationFrame(() => this._renderFrame());
            }

            /** The main rendering loop that draws tiles and markers. */
            _renderFrame() {
                this._ctx.clearRect(0, 0, this._width, this._height);
                if (!this._pixelOrigin) return;

                this._renderMarkers();

                const TILE_SIZE = 256;
                const zoom = this._zoom;

                // Calculate the range of tiles visible in the viewport
                const minTileX = Math.floor(this._pixelOrigin.x / TILE_SIZE);
                const minTileY = Math.floor(this._pixelOrigin.y / TILE_SIZE);
                const maxTileX = Math.ceil((this._pixelOrigin.x + this._width) / TILE_SIZE) - 1;
                const maxTileY = Math.ceil((this._pixelOrigin.y + this._height) / TILE_SIZE) - 1;

                // Loop through visible tiles and draw them
                for (let y = minTileY; y <= maxTileY; y++) {
                    for (let x = minTileX; x <= maxTileX; x++) {
                        const tileId = `${zoom}/${x}/${y}`;
                        const cachedTile = this._tileCache.get(tileId);

                        if (cachedTile && cachedTile.loaded) {
                            const tileX = x * TILE_SIZE - this._pixelOrigin.x;
                            const tileY = y * TILE_SIZE - this._pixelOrigin.y;
                            this._ctx.drawImage(cachedTile.image, tileX, tileY, TILE_SIZE, TILE_SIZE);
                        } else if (!cachedTile || !cachedTile.loading) {
                            // Load tile if not in cache or not already loading
                            const img = new Image();
                            img.src = this._getTileUrl(x, y, zoom);
                            img.onload = () => {
                                this._tileCache.set(tileId, { image: img, loaded: true, loading: false });
                                this._render(); // Redraw when tile loads
                            };
                            img.onerror = () => {
                                this._tileCache.set(tileId, { image: null, loaded: false, loading: false });
                            };
                            this._tileCache.set(tileId, { image: img, loaded: false, loading: true });
                        }
                    }
                }
            }

            // --- Event System ---

            /**
             * Subscribes a listener function to a map event.
             * @param {string} type - The event type (e.g., 'click', 'zoomend').
             * @param {Function} fn - The listener function.
             * @returns {Atlas} The map instance for chaining.
             */
            on(type, fn) {
                if (!this._events[type]) {
                    this._events[type] = [];
                }
                this._events[type].push(fn);
                return this;
            }

            /** Fires an event, calling all subscribed listeners. @private */
            _fire(type, data) {
                if (!this._events[type]) return;

                const event = { type, target: this, ...data };
                this._events[type].forEach(fn => fn(event));
            }

            // --- Public API ---

            /**
             * Sets the map view to a new center and zoom.
             * @param {number[]} latlng - The new center [latitude, longitude].
             * @param {number} zoom - The new zoom level.
             */
            setView(latlng, zoom) {
                const oldZoom = this._zoom;
                const oldCenter = this._center;
                const newZoom = Math.max(this._options.minZoom, Math.min(this._options.maxZoom, zoom));

                const zoomChanged = oldZoom !== undefined && newZoom !== oldZoom;
                const centerChanged = !oldCenter || (latlng[0] !== oldCenter[0] || latlng[1] !== oldCenter[1]);

                this._zoom = newZoom;
                this._center = latlng;

                this._updateView();

                if (centerChanged) this._fire('move');
                if (zoomChanged) this._fire('zoom', { zoom: this._zoom });
            }

            /**
             * Sets the map's zoom level.
             * @param {number} zoom - The new zoom level.
             * @param {object} [options] - Zoom options.
             * @param {{x: number, y: number}} [options.centerOn] - The screen point to keep centered during zoom.
             */
            setZoom(zoom, options = {}) {
                const oldZoom = this._zoom;
                const newZoom = Math.max(this._options.minZoom, Math.min(this._options.maxZoom, zoom));

                if (newZoom === oldZoom) return;

                if (options.centerOn) {
                    this._zoomAtPoint(newZoom, options.centerOn, true);
                } else {
                    this.setView(this._center, newZoom);
                }

                this._fire('zoomend', { zoom: this._zoom });
            }

            /** Zooms the map while keeping a specific screen point fixed. @private */
            _zoomAtPoint(newZoom, point, snap = true) {
                let zoom = snap ? Math.round(newZoom) : newZoom;
                zoom = Math.max(this._options.minZoom, Math.min(this._options.maxZoom, zoom));

                if (zoom === this._zoom) return;

                const rect = this._container.getBoundingClientRect();
                const screenPoint = { x: point.x - rect.left, y: point.y - rect.top };

                // Get the geographical coordinate of the point before zoom
                const worldPoint = { x: screenPoint.x + this._pixelOrigin.x, y: screenPoint.y + this._pixelOrigin.y };
                const latlng = this._unproject(worldPoint, this._zoom);

                // Calculate where the new center should be to keep the point fixed
                const newCenterPx = this._project(latlng, zoom);
                const newPixelOrigin = { x: newCenterPx.x - screenPoint.x, y: newCenterPx.y - screenPoint.y };

                const newCenter = this._unproject({
                    x: newPixelOrigin.x + this._width / 2,
                    y: newPixelOrigin.y + this._height / 2
                }, zoom);

                this.setView(newCenter, zoom);
            }

            // --- Marker System ---

            /**
             * Adds a new SVG marker to the map.
             * @param {number[]} latlng - The marker's geographical position [latitude, longitude].
             * @param {object} [options={}] - Marker options.
             * @param {string} [options.color='#3498db'] - The marker's fill color.
             * @param {string} [options.label] - A single character label to display on the marker.
             * @returns {object} The marker object.
             */
            addMarker(latlng, options = {}) {
                const marker = {
                    latlng,
                    options,
                    el: this._createMarkerElement(options)
                };

                this._markers.push(marker);
                this._markerPane.appendChild(marker.el);
                this._renderMarkers();

                return marker;
            }

            /** Creates the SVG elements for a marker. @private */
            _createMarkerElement(options) {
                const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                el.style.pointerEvents = 'auto'; // Make marker clickable
                el.style.cursor = 'pointer';

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('r', '10');
                circle.setAttribute('fill', options.color || '#3498db');
                circle.setAttribute('stroke', 'white');
                circle.setAttribute('stroke-width', '2');
                el.appendChild(circle);

                if (options.label) {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.textContent = options.label;
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('dy', '.35em');
                    text.setAttribute('fill', 'white');
                    text.setAttribute('font-size', '10px');
                    text.setAttribute('font-family', 'sans-serif');
                    el.appendChild(text);
                }

                return el;
            }

            /** Positions all markers on the map according to the current view. @private */
            _renderMarkers() {
                for (const marker of this._markers) {
                    const px = this._project(marker.latlng);
                    const screenX = px.x - this._pixelOrigin.x;
                    const screenY = px.y - this._pixelOrigin.y;

                    marker.el.setAttribute('transform', `translate(${screenX}, ${screenY})`);
                }
            }
        }

        // --- Demo Initialization ---

        // Create a new map instance
        const map = new Atlas('map-container', {
            center: [51.505, -0.09], // London
            zoom: 13
        });

        // Log map events to the console for debugging
        map.on('click', (e) => console.log('Click event:', e));
        map.on('zoomend', (e) => console.log('ZoomEnd event:', e));
        map.on('moveend', (e) => console.log('MoveEnd event:', e));

        // Add some example markers
        map.addMarker([51.505, -0.09], { color: '#e74c3c', label: 'C' });
        map.addMarker([51.51, -0.1], { color: '#2ecc71', label: 'A' });
        map.addMarker([51.5, -0.12], { label: 'B' });
    </script>
</body>
</html>
